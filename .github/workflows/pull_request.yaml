name: Pull Request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # base が b の PR だけ 60 秒待ってから失敗する。
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "base_ref=$BASE_REF"
          if [ "$BASE_REF" = "b" ]; then sleep 60; exit 1; fi

  # base が c の PR だけ、チェック名を status-check-pull-request-c にする。
  status-check-pull-request:
    name: ${{ github.base_ref == 'c' && 'status-check-pull-request-c' || 'status-check-pull-request' }}
    runs-on: ubuntu-latest
    if: always()
    needs:
      - pull-request
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
